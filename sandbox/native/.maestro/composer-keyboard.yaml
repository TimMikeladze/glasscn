appId: host.exp.Exponent
name: Chat composer — sticks above the keyboard, Return is a newline, send posts
---
- runFlow:
    file: _open.yaml
    env:
      ROUTE: c/chat
- tapOn:
    id: "composer"
- inputText: "Two nights in a row"
- takeScreenshot: screenshots/composer-keyboard
# the composer stays visible above the keyboard (KeyboardStickyView)
- assertVisible: "Two nights in a row"
# one tap sends, even with the keyboard up (keyboardShouldPersistTaps="handled")
- tapOn:
    text: "Send"
- assertVisible: "Noted: “Two nights in a row”."
- hideKeyboard
